name: Java CI

on:
  push:
    branches: [ "master", "main", "dev" ]
  pull_request:
    branches: [ "master", "main", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Compile Eden and Build JAR
      run: |
        mkdir -p build/classes
        find src/de -name "*.java" > sources.txt
        javac --release 8 -d build/classes @sources.txt
        cp -f bookWhite.txt bookBlack.txt build/classes/ 2>/dev/null || true
        jar cfe eden.jar de.czempin.chess.eden.Eden -C build/classes .

    - name: UCI Smoke Test
      run: |
        out=$(printf "uci\nisready\nposition startpos moves e2e4 e7e5\ngo depth 3\nquit\n" | timeout 15s java -jar eden.jar)
        echo "$out"
        echo "$out" | grep -q "uciok"
        echo "$out" | grep -q "readyok"
        echo "$out" | grep -q "bestmove "

    - name: Shallow Tricky-Position Perft Gate
      run: |
        check_perft() {
          local name="$1"
          local pos_cmd="$2"
          local depth="$3"
          local expected="$4"
          echo "Testing $name (perft $depth, expected $expected)..."
          out=$(printf "uci\n%s\ngo perft %s\nquit\n" "$pos_cmd" "$depth" | timeout 15s java -jar eden.jar)
          echo "$out"
          echo "$out" | grep -q "Nodes searched: ${expected} "
        }
        check_perft "Startpos" "position startpos" 3 8902
        check_perft "Kiwipete" "position fen r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1" 2 2039
        check_perft "CPW Pos 3 (EP Pin)" "position fen 8/2p5/3p4/KP5r/1R3p1k/8/4P1P1/8 w - - 0 1" 3 2812
        check_perft "CPW Pos 4 (Promotions & Castling)" "position fen r3k2r/Pppp1ppp/1b3nbN/nP6/BBP1P3/q4N2/Pp1P2PP/R2Q1RK1 w kq - 0 1" 2 264
